[project]
name = "cloney"
version = "0.1.0"
description = "Lokales Voice Cloning für deutsche Langform-Texte"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "soundfile>=0.12.1",
    "pyloudnorm>=0.1.1",
    "num2words>=0.5.13",
    "typer>=0.12",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
f5 = ["f5-tts>=1.0", "huggingface-hub>=0.23"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
cloney = "cloney.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloney"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
# Typer und FastAPI deklarieren Parameter idiomatisch über Aufrufe im Default.
"cloney/cli.py" = ["B008"]
"cloney/web/app.py" = ["B008"]
