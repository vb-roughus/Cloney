{# Die Achsen des Rasters hängen an der Engine und werden beim Wechsel neu geladen. #}
<div id="raster">
  {% if engine.options %}
    {% for option in engine.options %}
      <label>{{ option.label }}
        <input type="text" name="werte_{{ option.key }}"
               placeholder="{{ option.minimum | round(2) }}, {{ option.default | round(2) }}, {{ option.maximum | round(2) }}">
        <span class="muted">
          {{ option.help }}
          Mehrere Werte durch Komma trennen; leer lassen heißt: dieser Regler bleibt
          bei {{ "%d"|format(option.default) if option.integer else "%.2f"|format(option.default) }}
          und taucht im Vergleich nicht auf.
        </span>
      </label>
    {% endfor %}
  {% else %}
    <p class="notice">Diese Engine bietet keine Regler an &mdash; es gibt nichts zu vergleichen.</p>
  {% endif %}
</div>
